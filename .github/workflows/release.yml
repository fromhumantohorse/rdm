name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege: building only reads the repository. Only the `release` job (tags) may write,
# and it runs no third-party code (see there).
permissions:
  contents: read

# Supply chain: every action is pinned to a commit (a moved tag cannot swap its code), and every
# tool fetched at build time to an exact version.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rdm-windows
            arch: x64
          # Native on Windows on ARM (Snapdragon…), where an x64 program would run emulated.
          - os: windows-11-arm
            artifact: rdm-windows-arm64
            arch: arm64
          # The oldest supported Ubuntu: the binary needs at least the glibc it was built against,
          # and runs on every distribution newer than this one.
          - os: ubuntu-22.04
            artifact: rdm-linux
            arch: x64
          - os: ubuntu-22.04-arm
            artifact: rdm-linux-arm64
            arch: arm64
          # Apple Silicon: the binary is native on the M1 and every later chip (no Rosetta).
          - os: macos-latest
            artifact: rdm-macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: "11.0" # the first macOS on Apple Silicon: see packaging/macos/Info.plist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # build scripts and packages never see the token
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p rdm

      # Once is enough for what does not depend on the architecture.
      - name: Extension checks (syntax + unit tests)
        if: matrix.artifact == 'rdm-linux'
        run: sh extension/test/check.sh

      # web-ext and every package under it are pinned with their integrity hashes
      # (packaging/web-ext/package-lock.json): the signing step below runs it with the AMO keys.
      # No install script runs.
      - name: Extension builds (Firefox + Chromium) + lint
        if: matrix.artifact == 'rdm-linux'
        env:
          NODE_OPTIONS: --disable-proto=throw
        run: |
          sh packaging/firefox/build.sh
          sh packaging/chromium/build.sh
          npm ci --ignore-scripts --no-audit --no-fund --prefix packaging/web-ext
          node --disable-proto=throw --test packaging/web-ext/security.test.cjs
          npm audit --audit-level=moderate --ignore-scripts --prefix packaging/web-ext
          packaging/web-ext/node_modules/.bin/web-ext lint --self-hosted --source-dir target/firefox

      - name: Dependency audit (RustSec)
        if: matrix.artifact == 'rdm-linux'
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit

      - name: Dependency policy (licenses, sources, advisories)
        if: matrix.artifact == 'rdm-linux'
        run: cargo install cargo-deny --version 0.20.2 --locked && cargo deny check

      - name: Debian package
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --version 3.8.0 --locked && cargo deb -p rdm --no-build

      - name: Fedora package
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm --version 0.21.0 --locked && cargo generate-rpm -p crates/app

      - name: Windows installer (WiX 3)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wix.zip"
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile $zip
          # The archive of the WiX 3.14.1 release: anything else is refused.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw "unexpected WiX archive ($hash)" }
          Expand-Archive $zip "$env:LOCALAPPDATA\Programs\wix3"
          powershell -ExecutionPolicy Bypass -File packaging/windows/build-msi.ps1 -NoBuild -Arch $env:ARCH

      # Only Xcode can build it; build-app.sh puts it in RDM.app.
      - name: Safari extension
        if: runner.os == 'macOS'
        run: sh packaging/safari/build.sh

      - name: macOS application and disk image
        if: runner.os == 'macOS'
        run: sh packaging/macos/build-app.sh

      - name: Stage
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp RDM-*-setup.msi target/release/rdm.exe packaging/windows/install.ps1 dist/
          elif [ "$RUNNER_OS" = macOS ]; then
            cp RDM-*-macos-arm64.dmg dist/
          else
            # Its top folder is what update/install/linux.rs looks for.
            tarball="rdm-linux-$ARCH"
            mkdir "$tarball"
            cp target/release/rdm crates/app/assets/rdm.png "$tarball/" && cp -r packaging/linux/. "$tarball/"
            tar -czf "dist/$tarball.tar.gz" "$tarball"
            cp target/debian/*.deb target/generate-rpm/*.rpm dist/
            if [ -f target/rdm-chromium.zip ]; then
              cp target/rdm-chromium.zip dist/
              (cd target/firefox && zip -qr ../../dist/rdm-firefox.xpi .)
            fi
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist

  # Tags only. Release Firefox installs only packages signed by Mozilla: with the repository secrets
  # AMO_JWT_ISSUER / AMO_JWT_SECRET (free addons.mozilla.org account, "unlisted": nothing is
  # published), the .xpi is signed here, and the extension's ID is then Mozilla-registered to this
  # project (no one else can sign an extension under it, which RDM's native connector trusts). The
  # keys never reach the build job: no build script or package of the build can read them. Only
  # web-ext runs next to them, pinned with its whole dependency tree, its install scripts off.
  sign-firefox:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rdm-linux
          path: unsigned
      - name: Sign the Firefox package
        env:
          NODE_OPTIONS: --disable-proto=throw
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::notice::AMO keys not set: the release ships the unsigned Firefox package"
            exit 0
          fi
          npm ci --ignore-scripts --no-audit --no-fund --prefix packaging/web-ext
          unzip -q unsigned/rdm-firefox.xpi -d firefox
          packaging/web-ext/node_modules/.bin/web-ext sign --channel=unlisted --source-dir firefox --artifacts-dir signed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mkdir out
          cp signed/*.xpi out/rdm-firefox.xpi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: hashFiles('out/rdm-firefox.xpi') != ''
        with:
          name: rdm-firefox-signed
          path: out

  # Tags only: signs the update packages and publishes the release. Apart from the pinned checkout
  # and artifact download, it runs openssl and gh (both part of the runner): no tool fetched from a
  # registry and no build script ever runs next to the signing key, so none of them can alter a
  # package between its signature and its publication.
  release:
    needs: [build, sign-firefox]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Collect the packages (the signed Firefox package replaces the unsigned one)
        run: |
          mkdir dist
          cp artifacts/rdm-windows/* artifacts/rdm-windows-arm64/* artifacts/rdm-linux/* artifacts/rdm-linux-arm64/* artifacts/rdm-macos/* dist/
          if [ -f artifacts/rdm-firefox-signed/rdm-firefox.xpi ]; then
            cp artifacts/rdm-firefox-signed/rdm-firefox.xpi dist/rdm-firefox.xpi
          fi

      - name: Every package is there
        run: |
          for pattern in 'dist/*-x64-setup.msi' 'dist/*-arm64-setup.msi' 'dist/*_amd64.deb' 'dist/*_arm64.deb' 'dist/*.x86_64.rpm' 'dist/*.aarch64.rpm' \
            'dist/*.dmg' dist/rdm-linux-x64.tar.gz dist/rdm-linux-arm64.tar.gz dist/rdm-chromium.zip dist/rdm-firefox.xpi; do
            compgen -G "$pattern" >/dev/null || { echo "::error::missing $pattern"; exit 1; }
          done

      # RDM installs an update only if its package carries a valid Ed25519 signature made with this
      # key (repository secret RDM_SIGNING_KEY, a PEM private key; its public half is compiled into
      # RDM, see crates/app/src/update/package.rs). What is signed binds the package to its version, so an
      # old package cannot be replayed as a new one. Tagged builds refuse to ship without it.
      - name: Sign the update packages
        env:
          RDM_SIGNING_KEY: ${{ secrets.RDM_SIGNING_KEY }}
        run: sh .github/sign-packages.sh "${GITHUB_REF#refs/tags/v}" dist

      # Firefox and its derivatives (Waterfox, LibreWolf…) keep their own copy of the extension:
      # they update it from this file (the manifest's `update_url`, the latest release's asset).
      - name: Firefox update manifest
        run: |
          version=$(jq -r .version extension/manifest.json)
          id=$(jq -r .browser_specific_settings.gecko.id extension/manifest.json)
          hash=$(sha256sum dist/rdm-firefox.xpi | cut -d' ' -f1)
          link="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/rdm-firefox.xpi"
          jq -n --arg id "$id" --arg v "$version" --arg link "$link" --arg hash "sha256:$hash"             '{addons: {($id): {updates: [{version: $v, update_link: $link, update_hash: $hash}]}}}' >dist/updates.json
          cat dist/updates.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          notes=docs/releases/$tag.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [ -f "$notes" ]; then
              gh release create "$tag" --verify-tag --title "RDM ${tag#v}" --notes-file "$notes"
            else
              gh release create "$tag" --verify-tag --title "RDM ${tag#v}" --generate-notes
            fi
          fi
          gh release upload "$tag" --clobber dist/*.msi dist/*.deb dist/*.rpm dist/*.dmg dist/*.tar.gz dist/*.xpi dist/*.zip dist/*.sig dist/updates.json
